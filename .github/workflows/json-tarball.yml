jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: checks out latest tag
        run: git checkout "$(git describe --tags "$(git rev-list --tags --max-count=1)")"
      - name: runs cargo test
        run: |
          mkdir --parents ./cache
          export TOMBI_CACHE_HOME="$( realpath ./cache )"
          cargo test
      - name: creates the tarball
        run: |
          export XZ_OPTS="-9e -T0"
          find cache -type f -name '*.json' | xargs tar cf json-tarball.tar.xz
      - env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        name: uploads the tarball
        run: |
          gh release upload "$(git describe --tags "$(git rev-list --tags --max-count=1)")" json-tarball.tar.xz
name: json_tarball
on:
  release:
    types:
      - published
  workflow_dispatch:
