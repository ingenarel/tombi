jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: checks out latest tag
        run: git checkout "$(git describe --tags "$(git rev-list --tags --max-count=1)")"
      - env:
          TOMBI_CACHE_HOME: ./cache
        name: runs cargo test
        run: |
          mkdir --parents "$( realpath "${TOMBI_CACHE_HOME}" )"
          cargo test
      - name: list files
        run: find "$( realpath "${TOMBI_CACHE_HOME}" )"
name: json_tarball
on:
  release:
    types:
      - published
  workflow_dispatch:
